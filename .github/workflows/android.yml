name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build runs Gradle and the unit tests on JDK 25: gradle/gradle-daemon-jvm.properties
      # pins the daemon toolchain to 25 and Robolectric 4.17 handles it. Installing the same
      # version here is what keeps the foojay resolver from downloading a JDK on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # setup-android@v3 defaults to `packages: 'tools platform-tools'`, and the legacy `tools`
      # package is no longer in the SDK repository — sdkmanager then exits 1 with
      # "Failed to find package 'tools'" before the build even starts. platform-tools is all this
      # job needs: the action accepts the licences, so Gradle downloads the platform and
      # build-tools the module asks for.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble the debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
